<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareerBot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f3f7fd; --card:#fff; --text:#14213d; --muted:#667085; --blue:#2563eb; --blue-d:#1d4ed8;
  --blue-l:#e6efff; --line:#e3e9f3; --ok:#16a34a; --warn:#f59e0b; --pink:#ec4899; --violet:#7c3aed;
  --radius:16px; --shadow:0 2px 10px rgba(30,64,175,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:10px}
header.top .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:700}
header.top h1{font-size:20px;margin:0}
header.top small{display:block;color:var(--muted);font-size:12px}
#screen{flex:1;padding:6px 16px 110px}
h2{font-size:22px;margin:8px 0 6px}
h3{font-size:17px;margin:14px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:10px 0;box-shadow:var(--shadow)}
.card.hero{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff}
.card.hero .muted{color:#dbe6ff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;background:var(--blue);color:#fff;cursor:pointer;text-align:center}
.btn:active{background:var(--blue-d)}
.btn.sec{background:var(--blue-l);color:var(--blue)}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.white{background:#fff;color:var(--blue)}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);cursor:pointer;border:0;text-align:left;font:inherit;color:inherit}
.tile .ic{font-size:26px}
.tile b{display:block;margin-top:4px}
.tile span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--text);padding:7px 12px;border-radius:999px;font-size:14px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tag{display:inline-block;background:var(--blue-l);color:var(--blue);padding:3px 10px;border-radius:999px;font-size:12px;margin:2px 4px 2px 0}
input[type=text],textarea,select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);font:inherit;background:#fff;color:var(--text)}
textarea{min-height:110px;resize:vertical}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:width .25s}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;font:inherit;color:var(--text);cursor:pointer}
.opt.sel{border-color:var(--blue);background:var(--blue-l)}
.bar{margin:10px 0}
.bar .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .tr{height:12px;border-radius:8px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:8px}
.pcard{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pcard .em{font-size:30px;width:48px;height:48px;border-radius:14px;background:var(--blue-l);display:grid;place-items:center;flex:none}
.pcard .info{flex:1;min-width:0}
.pcard .info b{display:block}
.match{font-weight:700;color:var(--blue);white-space:nowrap}
.fav{border:0;background:none;font-size:22px;cursor:pointer;padding:0 2px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
td:first-child{color:var(--muted);width:26%;font-size:13px}
ul{margin:6px 0;padding-left:20px}
.note{background:#fff7e0;border-radius:12px;padding:10px 12px;font-size:13px;color:#7a5a00;margin:10px 0}
.back{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;padding:6px 0;cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;background:none;border:0;padding:9px 2px 8px;font:inherit;font-size:11px;color:var(--muted);cursor:pointer}
nav.tabs button .i{display:block;font-size:22px;line-height:1.1}
nav.tabs button.on{color:var(--blue);font-weight:700}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:#fff;box-shadow:var(--shadow);border-bottom-left-radius:4px}
.chatbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 16px;z-index:4}
.chatbar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.chatbar input{flex:1}
.chatbar button{width:auto;padding:0 18px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>

function computeScores(){
  const raw={},max={};
  CAT_KEYS.forEach(k=>{raw[k]=0;max[k]=0});
  Q.forEach((q,i)=>{
    CAT_KEYS.forEach(k=>{max[k]+=Math.max(0,...q[1].map(o=>o[1][k]||0));});
    const a=S.answers[i];
    if(a!==undefined){const m=q[1][a][1];CAT_KEYS.forEach(k=>raw[k]+=m[k]||0);}
  });
  const norm={};
  CAT_KEYS.forEach(k=>norm[k]=max[k]?Math.round(raw[k]/max[k]*100):0);
  return norm;
}
function matchFor(p,scores){
  const tw=Object.values(p.w).reduce((a,b)=>a+b,0);
  let s=0;for(const k in p.w)s+=(scores[k]||0)*p.w[k];
  return Math.round(s/tw);
}
function ranking(){
  return PROFS.map(p=>({p,m:matchFor(p,S.scores)})).sort((a,b)=>b.m-a.m);
}
function topCats(n=2){return Object.entries(S.scores).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0]);}

function go(s,p=null,push=true){
  if(push&&cur.s!==s)cur.stack.push({s:cur.s,p:cur.p});
  cur.s=s;cur.p=p;render();window.scrollTo(0,0);updateBack();
}
function back(){const prev=cur.stack.pop();if(prev){cur.s=prev.s;cur.p=prev.p;render();updateBack();}else go('home',null,false);}
function updateBack(){
  if(!tg||!tg.BackButton)return;
  try{ if(cur.stack.length&&cur.s!=='home'){tg.BackButton.show();}else{tg.BackButton.hide();} }catch(e){}
}
if(tg&&tg.BackButton){try{tg.BackButton.onClick(back);}catch(e){}}
function tab(s){cur.stack=[];go(s,null,false);}

  $('tabs').innerHTML=TABS.map(([k,i,l])=>`<button data-act="tab" data-v="${k}" class="${TABOF[cur.s]===k?'on':''}"><span class="i">${i}</span>${l}</button>`).join('');

  if(sel.length>=2){
   const rows=[['Задачи',p=>p.tasks.join('; ')],['Навыки',p=>p.skills.join(', ')],['Рабочая среда',p=>p.env],['Предметы',p=>p.subj.join(', ')],['Обучение',p=>p.edu]];
   tbl=`<div class="card" style="overflow-x:auto"><table><tr><th></th>${sel.map(p=>`<th>${p.e} ${esc(p.t)}</th>`).join('')}</tr>
   ${rows.map(r=>`<tr><td>${r[0]}</td>${sel.map(p=>`<td>${esc(r[1](p))}</td>`).join('')}</tr>`).join('')}</table></div>
   <div class="card"><h3 style="margin-top:0">Вопросы для самоанализа</h3><ul>
   <li>Какие из перечисленных задач мне было бы интересно решать каждый день?</li>
   <li>Какие навыки у меня уже есть, а какие я готов(а) развивать?</li>
   <li>В какой рабочей среде мне комфортнее?</li>
   <li>Какие школьные предметы мне стоит подтянуть?</li></ul>
   <p class="muted">Победителя нет — это сравнение для размышления.</p></div>`;
  }
  return `<h2>Сравнение профессий</h2><div class="card">${opts(0)}<div style="height:8px"></div>${opts(1)}<div style="height:8px"></div>${opts(2)}</div>${tbl}`;
 },
 favs(){
  const l=S.favs.map(id=>PROFS.find(p=>p.id===id)).filter(Boolean);
  return `<h2>Избранное</h2>${l.length?l.map(p=>profCard(p,S.scores?matchFor(p,S.scores):undefined)).join(''):'<div class="empty">Пока пусто. Нажми 🤍 на карточке профессии.</div>'}`;
 },
 try(){
  const p=cur.p?PROFS.find(x=>x.id===cur.p):null;
  if(!p){
   return `<h2>Попробуй профессию</h2><p class="muted">Короткие безопасные задания, похожие на настоящие задачи специалистов.</p>
   ${PROFS.map(p=>`<div class="card pcard" data-act="try1" data-v="${p.id}"><div class="em">${p.e}</div><div class="info"><b>${esc(p.task.title)}</b><span class="muted">${esc(p.t)}</span></div></div>`).join('')}`;
  }
  const done=S.tryDone&&S.tryDone[p.id];
  return `<button class="back" data-act="back">← Назад</button>
   <div class="card"><span class="tag">${p.e} ${esc(p.t)}</span><h2>${esc(p.task.title)}</h2><p>${esc(p.task.text)}</p>
   <textarea id="ta" placeholder="Напиши свой ответ…">${esc(done||'')}</textarea><div style="height:10px"></div>
   <button class="btn" data-act="sendtask" data-v="${p.id}">Отправить ответ</button></div>
   <div id="fb"></div>`;
 },
 route(){
  const ids=Object.keys(S.route).map(Number);
  const l=ids.map(id=>PROFS.find(p=>p.id===id)).filter(Boolean);
  if(!l.length)return `<h2>Мой маршрут</h2><div class="empty">Маршрут пока пуст.<br>Открой карточку профессии и нажми «В маршрут».<br><br><button class="btn small" data-act="go" data-v="catalog">К профессиям</button></div>`;
  return `<h2>Мой маршрут</h2>`+l.map(p=>{
    const steps=['Узнать о профессии: прочитать карточку','Попробовать мини-задание','Изучить школьные предметы: '+p.subj.join(', '),'Найти программы на официальных сайтах учебных заведений'];
    const st=S.route[p.id];
    const doneN=st.filter(Boolean).length;
    return `<div class="card"><div class="row"><b>${p.e} ${esc(p.t)}</b><span class="muted" style="text-align:right;flex:none">${doneN}/${steps.length}</span></div>
     <div class="prog"><i style="width:${doneN/steps.length*100}%"></i></div>
     ${steps.map((s,i)=>`<label class="check"><input type="checkbox" data-act="step" data-p="${p.id}" data-i="${i}" ${st[i]?'checked':''}><span>${esc(s)}</span></label>`).join('')}
     <div style="height:8px"></div><button class="btn small ghost" data-act="rmroute" data-v="${p.id}">Убрать</button></div>`;
  }).join('');
 },
 mentor(){
  const msgs=S.chat.length?S.chat:[{r:'b',t:'Привет! Я AI-наставник. Спроси про профессию из каталога, школьные предметы или с чего начать знакомство с направлением.'}];
  return `<h2>AI-наставник</h2>
   <div class="note">🧪 Демо-режим: ответы собираются из каталога прямо в браузере. В полной версии запросы идут на сервер, и ответ формирует языковая модель по проверенным материалам.</div>
   <label class="check"><input type="checkbox" id="mc" ${S.mentorConsent?'checked':''}><span>Разрешить использовать мой профиль интересов в ответах</span></label>
   <div class="chips">${['Чем занимается программист?','Какие предметы нужны врачу?','С чего начать выбор профессии?'].map(t=>`<button class="chip" data-act="quick" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>
   <div class="chat" id="chat">${msgs.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join('')}</div>
   <div style="height:70px"></div>
   <div class="chatbar"><div class="in"><input type="text" id="mi" placeholder="Напиши вопрос…"><button class="btn" data-act="send">➤</button></div></div>`;
 },
 profile(){
  if(!S.consent)return SCREENS.onboarding();
  return `<h2>Профиль</h2>
   <div class="card"><b>Класс</b><div class="chips">${[8,9,10,11].map(g=>`<button class="chip ${S.grade===g?'on':''}" data-act="grade2" data-v="${g}">${g}</button>`).join('')}</div>
    ${tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?`<p class="muted">Telegram: ${esc(tg.initDataUnsafe.user.first_name||'')}</p>`:'<p class="muted">Открыто вне Telegram (режим предпросмотра).</p>'}</div>
   <div class="card"><b>История прохождений</b>${S.history.length?S.history.slice().reverse().map(h=>`<p class="muted">${esc(h.date)} — ${h.top.map(k=>CATS[k].t).join(', ')}</p>`).join(''):'<p class="muted">Пока нет завершённых тестов.</p>'}
    ${S.done?'<button class="btn small sec" data-act="go" data-v="results">Последний результат</button>':''}</div>
   <div class="card"><b>Управление данными</b><p class="muted">Все данные прототипа хранятся только на твоём устройстве. В полной версии — на сервере, с возможностью удаления.</p>
    <button class="btn danger" data-act="wipe">Удалить профиль и данные</button></div>`;
 }
};

function render(){
  $('screen').innerHTML=SCREENS[cur.s]?SCREENS[cur.s]():'';
  renderTabs();
}

/* ============ Наставник ============ */
function mentorReply(text){
  const t=text.toLowerCase();
  const p=PROFS.find(x=>{const stem=x.t.toLowerCase().split(/[ \/]/)[0];return t.includes(stem.slice(0,Math.max(5,stem.length-2)));});
  let a;
  if(p){
    if(/предмет|егэ|огэ|сдавать/.test(t)){a=`Для направления «${p.t}» чаще всего полезны: ${p.subj.join(', ')}. Точный список экзаменов зависит от конкретной программы — проверьте на сайте учебного заведения.`;}
    else{a=`${p.t}: ${p.d}\n\nТипичные задачи: ${p.tasks.join('; ')}.\nВажные навыки: ${p.skills.join(', ')}.\n\nМожно попробовать мини-задание «${p.task.title}» на экране «Попробуй профессию».`;}
  }else if(/начать|выбрать|выбор|не знаю/.test(t)){
    a='Начни с малого: 1) пройди тест интересов; 2) посмотри 3–4 профессии из результата; 3) попробуй по одному мини-заданию; 4) сравни варианты; 5) поговори с людьми, которые работают в этой сфере. Выбор можно пересматривать — это нормально.';
  }else if(/предмет/.test(t)){
    a='Скажи, какая профессия тебя интересует, и я назову связанные школьные предметы. Например: «Какие предметы нужны врачу?»';
  }else{
    a='Я пока не нашёл ответ в каталоге. Попробуй назвать профессию из списка (например, «программист» или «психолог») или спроси, с чего начать выбор.';
  }
  if(S.mentorConsent&&S.scores){
    const tc=topCats(2).map(k=>CATS[k].t.toLowerCase());
    a+=`\n\n(С учётом твоего профиля интересов: ${tc.join(' и ')}. Это лишь ориентир.)`;
  }
  return a;
}
function sendMsg(text){
  text=text.trim();if(!text)return;
  S.chat.push({r:'u',t:text});S.chat.push({r:'b',t:mentorReply(text)});
  if(S.chat.length>40)S.chat=S.chat.slice(-40);
  save();render();
  const c=$('chat');if(c&&c.lastElementChild)c.lastElementChild.scrollIntoView({block:'center'});
}

/* ============ События ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  if(el.tagName==='INPUT'||el.tagName==='SELECT')return;
  switch(a){
    case 'tab':tab(v);break;
    case 'go':go(v);break;
    case 'back':back();break;
    case 'grade':S.grade=+v;save();render();break;
    case 'grade2':S.grade=+v;save();render();toast('Класс сохранён');break;
    case 'start':
      if(!S.grade){toast('Выбери класс');break;}
      if(!$('cons').checked){toast('Отметь, что ознакомился(ась) с уведомлением');break;}
      S.consent=true;save();render();break;
    case 'ans':{
      const i=Math.min(S.qi,Q.length-1);S.answers[i]=+v;save();render();
      setTimeout(()=>{ if(cur.s==='test'&&!S.done&&S.answers[i]!==undefined) nextQ(); },280);
      break;}
    case 'nextq':nextQ();break;
    case 'prevq':if(S.qi>0){S.qi--;save();render();}break;
    case 'retake':S.answers={};S.qi=0;S.done=false;S.scores=null;save();render();break;
    case 'prof':go('prof',+v);break;
    case 'fav':{
      e.stopPropagation();const id=+v;
      S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id];
      save();render();toast(S.favs.includes(id)?'Добавлено в избранное':'Убрано из избранного');break;}
    case 'cat':catFilter=v;render();break;
    case 'cmp1':{
      const id=+v;if(!S.cmp.includes(id)){const k=S.cmp.indexOf(null);S.cmp[k===-1?0:k]=id;}
      save();go('compare');break;}
    case 'addroute':{const id=+v;if(!S.route[id])S.route[id]=[false,false,false,false];save();toast('Добавлено в маршрут');break;}
    case 'rmroute':delete S.route[+v];save();render();break;
    case 'try1':go('try',+v);break;
    case 'sendtask':{
      const p=PROFS.find(x=>x.id===+v),val=$('ta').value.trim();
      if(val.length<15){toast('Напиши чуть подробнее');break;}
      S.tryDone=S.tryDone||{};S.tryDone[p.id]=val;save();
      $('fb').innerHTML=`<div class="card"><h3 style="margin-top:0">✅ Ответ принят</h3>
       <p>В этом задании применяются навыки: ${p.task.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</p>
       <p class="muted">Самопроверка:</p>
       <ul><li>Я описал(а) шаги по порядку?</li><li>Мой ответ понятен человеку, который не знаком с темой?</li><li>Я учёл(а) возможные трудности?</li></ul>
       <p class="muted">В полной версии ответ проверяется по критериям, заданным для профессии.</p></div>`;
      break;}
    case 'quick':sendMsg(v);break;
    case 'send':{const i=$('mi');sendMsg(i.value);break;}
    case 'wipe':
      if(confirm('Удалить все данные профиля? Это действие нельзя отменить.')){
        try{localStorage.removeItem(KEY);}catch(err){}
        S={...defState,answers:{},history:[],favs:[],route:{},chat:[],cmp:[null,null,null]};cur.stack=[];go('home',null,false);toast('Данные удалены');
      }break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.act==='cmpsel'){S.cmp[+el.dataset.i]=el.value?+el.value:null;save();render();}
  else if(el.dataset&&el.dataset.act==='step'){S.route[+el.dataset.p][+el.dataset.i]=el.checked;save();render();}
  else if(el.id==='mc'){S.mentorConsent=el.checked;save();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){
    query=e.target.value;
    const q=query.trim().toLowerCase();
    const list=PROFS.filter(p=>(catFilter==='Все'||p.cat===catFilter)&&(!q||(p.t+' '+p.d+' '+p.skills.join(' ')).toLowerCase().includes(q)));
    $('plist').innerHTML=list.length?list.map(p=>profCard(p,S.scores?matchFor(p,S.scores):undefined)).join(''):'<div class="empty">Ничего не найдено. Попробуй другой запрос.</div>';
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='mi'){sendMsg(e.target.value);} });

function nextQ(){
  const i=Math.min(S.qi,Q.length-1);
  if(S.answers[i]===undefined)return;
  if(i<Q.length-1){S.qi=i+1;save();render();}
  else{
    S.scores=computeScores();S.done=true;
    S.history.push({date:new Date().toLocaleDateString('ru-RU'),top:topCats(2)});
    save();go('results',null,false);
  }
}

/* ============ Старт ============ */
render();
</script>
</body>
</html>
